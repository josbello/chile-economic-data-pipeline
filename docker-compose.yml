services:

  postgres:
    image: postgres:17
    container_name: chile-economic-postgres

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${DOCKER_DB_PORT:-5433}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/views.sql:/docker-entrypoint-initdb.d/02-views.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  etl:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: chile-economic-etl

    env_file:
      - .env

    volumes:
    - ./data:/app/data
    - ./logs:/app/logs

    environment:
      DB_HOST: postgres
      DB_PORT: 5432

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"


volumes:
  postgres_data: